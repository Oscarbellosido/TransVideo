<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resum de vídeos · By CRE</title>
<meta name="description" content="Resum diari dels vídeos de YouTube de Juan Ramón Rallo, Pablo Gil, Marc Vidal i Bitcoin al día.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0c1626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vídeos">
<style>
:root {
  color-scheme: dark;
  --bg: #0c1626; --bg-2: #111f33; --card: #15263d; --card-2: #1a2e48;
  --text: #eef3f8; --text-2: #a9b8c9; --muted: #7d8ea3;
  --border: rgba(148,178,214,0.16); --accent: #3987e5; --shadow: rgba(0,0,0,0.35);
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #f4f6f9; --bg-2: #ffffff; --card: #ffffff; --card-2: #f2f5f9;
  --text: #0b0b0b; --text-2: #52514e; --muted: #74736e;
  --border: rgba(20,40,70,0.12); --accent: #2a78d6; --shadow: rgba(20,40,70,0.08);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 920px; margin: 0 auto; padding: 0 16px 60px; }
header { display: flex; align-items: center; gap: 12px; padding: 22px 0 14px; flex-wrap: wrap; }
h1 { font-size: 1.5rem; margin: 0; flex: 1; letter-spacing: -0.01em; }
h1 span { color: var(--text-2); font-weight: 400; }
h1 em { font-style: normal; font-size: .75rem; color: var(--muted); font-weight: 500; margin-left: 6px; }
.btn { background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 7px 12px; font: inherit; font-size: .9rem; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.actualitzat { color: var(--muted); font-size: .85rem; margin: -6px 0 14px; }
.avis { background: #e0a52622; border: 1px solid #e0a526; color: var(--text); border-radius: 12px; padding: 10px 14px; margin: -4px 0 16px; font-size: .9rem; }

.dies { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; scrollbar-width: thin; }
.dia { flex: none; background: var(--card); border: 1px solid var(--border); color: var(--text-2); border-radius: 999px; padding: 6px 14px; cursor: pointer; font: inherit; font-size: .9rem; }
.dia[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }

.xips { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 18px; }
.xip { display: inline-flex; align-items: center; gap: 7px; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 999px; padding: 5px 12px 5px 9px; cursor: pointer; font: inherit; font-size: .88rem; }
.xip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.xip[aria-pressed="false"] { opacity: .45; }
.xip b { color: var(--muted); font-weight: 500; }
input[type=search] { flex: 1; min-width: 160px; background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 6px 14px; font: inherit; font-size: .9rem; }

.resum-dia { background: linear-gradient(135deg, var(--card-2), var(--card)); border: 1px solid var(--border); border-radius: 16px; padding: 18px 20px; margin-bottom: 22px; box-shadow: 0 6px 20px var(--shadow); }
.resum-dia .et { font-size: .75rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-weight: 700; }
.resum-dia h2 { font-size: 1.2rem; margin: 6px 0 10px; line-height: 1.35; }
.resum-dia ul { margin: 0; padding-left: 20px; }
.resum-dia li { margin: 6px 0; color: var(--text-2); }
.resum-dia li strong { color: var(--text); }
.resum-dia .subt { font-size: .95rem; margin: 16px 0 4px; }
.resum-dia.setmanal { border-color: var(--accent); }
.dia.setmana { border-style: dashed; }

.video { background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--c); border-radius: 14px; margin-bottom: 14px; overflow: hidden; }
.cap { display: grid; grid-template-columns: 168px 1fr; gap: 14px; padding: 14px; }
.miniatura { position: relative; display: block; border-radius: 8px; overflow: hidden; aspect-ratio: 16/9; background: var(--card-2); }
.miniatura img { width: 100%; height: 100%; object-fit: cover; display: block; }
.miniatura span { position: absolute; right: 5px; bottom: 5px; background: rgba(0,0,0,.8); color: #fff; font-size: .75rem; padding: 1px 5px; border-radius: 4px; }
.meta { font-size: .8rem; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.meta .canal { color: var(--c); font-weight: 700; }
.video h3 { font-size: 1.02rem; margin: 3px 0 6px; line-height: 1.3; }
.video h3 a { color: inherit; text-decoration: none; }
.video h3 a:hover { text-decoration: underline; }
.video .resum { margin: 0; color: var(--text-2); }
details { border-top: 1px solid var(--border); }
summary { cursor: pointer; padding: 10px 14px; color: var(--accent); font-size: .9rem; font-weight: 600; list-style: none; }
summary::-webkit-details-marker { display: none; }
summary::before { content: "▸ "; }
details[open] summary::before { content: "▾ "; }
.cos { padding: 0 18px 16px; }
.cos h4 { font-size: .78rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 12px 0 4px; }
.cos ul { margin: 0; padding-left: 20px; }
.cos li { margin: 5px 0; }
.minut { font-size: .78rem; color: var(--accent); text-decoration: none; white-space: nowrap; border: 1px solid var(--border); border-radius: 999px; padding: 0 7px; margin-left: 4px; }
.minut:hover { border-color: var(--accent); }
.conclusio { background: var(--card-2); border-radius: 10px; padding: 10px 14px; margin-top: 12px; }
.temes { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.tema { font-size: .75rem; background: var(--card-2); color: var(--text-2); border-radius: 999px; padding: 2px 9px; cursor: pointer; border: 0; font-family: inherit; }
.buit { text-align: center; color: var(--muted); padding: 40px 0; }

/* Àudio */
.accions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.escolta { display: inline-flex; align-items: center; gap: 6px; background: var(--card-2); color: var(--text); border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: .85rem; cursor: pointer; }
.escolta:hover { border-color: var(--accent); }
.escolta.principal { background: var(--accent); border-color: var(--accent); color: #fff; }
.escolta.sona { border-color: var(--accent); color: var(--accent); }
.escolta.principal.sona { color: #fff; }
.meta .escolta { padding: 1px 9px; font-size: .78rem; margin-left: auto; }
.video.sona { box-shadow: 0 0 0 2px var(--accent); }
.reproductor { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(620px, calc(100% - 32px)); background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 10px 30px var(--shadow); padding: 10px 12px; display: none; align-items: center; gap: 10px; z-index: 10; }
.reproductor.actiu { display: flex; }
.reproductor .que { flex: 1; min-width: 0; font-size: .85rem; }
.reproductor .que b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.reproductor .que small { color: var(--muted); }
.reproductor button, .reproductor select { background: var(--card-2); color: var(--text); border: 1px solid var(--border); border-radius: 10px; font: inherit; font-size: .9rem; padding: 6px 9px; cursor: pointer; }
body.amb-reproductor .wrap { padding-bottom: 100px; }
footer { color: var(--muted); font-size: .8rem; text-align: center; margin-top: 30px; }

@media (max-width: 560px) {
  .cap { grid-template-columns: 1fr; }
  h1 { font-size: 1.25rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📺 Resum de vídeos <span>economia i inversió</span><em>By CRE</em></h1>
    <button class="btn" id="tema" title="Canvia el tema">🌓</button>
  </header>
  <p class="actualitzat" id="actualitzat"></p>
  <div class="avis" id="avis" hidden></div>
  <nav class="dies" id="dies" aria-label="Dies"></nav>
  <div id="resumDia"></div>
  <div class="xips" id="xips"></div>
  <div id="llista"></div>
  <footer>Resums fets per Claude a partir de les transcripcions automàtiques de YouTube. Poden contenir errors: en cas de dubte, mira el vídeo.</footer>
</div>
<div class="reproductor" id="reproductor" role="region" aria-label="Reproductor d'àudio">
  <div class="que"><b id="rpQue"></b><small id="rpPas"></small></div>
  <button id="rpPausa" title="Pausa / continua">⏸</button>
  <button id="rpSeg" title="Següent">⏭</button>
  <select id="rpVel" title="Velocitat"><option value="0.9">0,9×</option><option value="1">1×</option><option value="1.15">1,15×</option><option value="1.3">1,3×</option><option value="1.5">1,5×</option></select>
  <button id="rpAtura" title="Atura">⏹</button>
</div>

<script src="dades/resums.js"></script>
<script>
const D = window.RESUMS || { videos: [], dies: {} };
const CANALS = window.CANALS || [];
const canal = Object.fromEntries(CANALS.map(c => [c.id, c]));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const guarda = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const llegeix = k => { try { return localStorage.getItem(k); } catch { return null; } };
const VEU_OK = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;

// Tema
const tema = llegeix('tv-tema');
if (tema) document.documentElement.dataset.theme = tema;
document.getElementById('tema').onclick = () => {
  const nou = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
  document.documentElement.dataset.theme = nou; guarda('tv-tema', nou);
};

const fmtDia = d => new Date(d + 'T12:00').toLocaleDateString('ca', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtHora = d => new Date(d).toLocaleString('ca', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
// Un punt clau pot ser un text o { text, t } amb el segon del vídeo on es diu.
const txt = p => typeof p === 'string' ? p : p?.text || '';
const mmss = s => s >= 3600 ? `${Math.floor(s / 3600)}:${String(Math.floor(s % 3600 / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}` : `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
const fmtDurada = s => s >= 3600 ? `${Math.floor(s / 3600)} h ${Math.round(s % 3600 / 60)} min` : `${Math.round(s / 60)} min`;

// Seleccions possibles: un dia ('AAAA-MM-DD'), una setmana ('S:AAAA-MM-DD', data de tancament) o tot ('*').
const SETMANES = D.setmanes || {};
const lots = [...new Set(D.videos.map(v => v.lot).concat(Object.keys(D.dies)))]
  .concat(Object.keys(SETMANES).map(d => 'S:' + d))
  .sort((a, b) => a.replace('S:', '').localeCompare(b.replace('S:', '')) || (a.startsWith('S:') ? 1 : -1)).reverse();
const diaLocal = iso => new Date(iso).toLocaleDateString('sv-SE');
const fmtCurt = d => new Date(d + 'T12:00').toLocaleDateString('ca', { day: 'numeric', month: 'short' });
const esDelLot = v => lotActiu === '*' || (lotActiu.startsWith('S:')
  ? diaLocal(v.data) >= SETMANES[lotActiu.slice(2)].des_de && diaLocal(v.data) <= lotActiu.slice(2)
  : v.lot === lotActiu);
const liEtiqueta = p => { const m = p.match(/^([^.:]{2,30}[.:])\s(.*)$/); return `<li>${m ? `<strong>${esc(m[1])}</strong> ${esc(m[2])}` : esc(p)}</li>`; };
let lotActiu = lots.find(l => !l.startsWith('S:')) || lots[0] || '*';
let filtre = new Set(CANALS.map(c => c.id));
let cerca = '';

if (D.actualitzat) document.getElementById('actualitzat').textContent = 'Actualitzat ' + fmtHora(D.actualitzat);
// La tasca s'executa cada dia: si fa més de 36 h que no s'actualitza, alguna cosa ha fallat.
{
  const hores = D.actualitzat ? (Date.now() - new Date(D.actualitzat)) / 36e5 : Infinity;
  if (hores > 36) {
    const el = document.getElementById('avis');
    el.hidden = false;
    el.textContent = hores === Infinity ? '⚠ Encara no hi ha cap actualització.'
      : `⚠ Fa ${Math.floor(hores / 24) >= 2 ? Math.floor(hores / 24) + ' dies' : Math.round(hores) + ' hores'} que no hi ha resums nous. Potser la tasca diària no s'ha executat (PC apagat o app de Claude tancada) o YouTube ha bloquejat les transcripcions.`;
  }
}

function pintaDies() {
  const el = document.getElementById('dies');
  el.innerHTML = [...lots.map(l => `<button class="dia${l.startsWith('S:') ? ' setmana' : ''}" data-lot="${l}" aria-pressed="${l === lotActiu}">${l.startsWith('S:')
    ? `📅 Setmana ${esc(fmtCurt(SETMANES[l.slice(2)].des_de))} – ${esc(fmtCurt(l.slice(2)))}`
    : (l === new Date().toLocaleDateString('sv-SE') ? 'Avui · ' : '') + esc(fmtDia(l))}</button>`),
    `<button class="dia" data-lot="*" aria-pressed="${lotActiu === '*'}">Tots</button>`].join('');
  el.querySelectorAll('.dia').forEach(b => b.onclick = () => { lotActiu = b.dataset.lot; pinta(); });
}

function pintaResumDia() {
  if (lotActiu.startsWith('S:')) return pintaResumSetmana();
  const r = D.dies[lotActiu];
  document.getElementById('resumDia').innerHTML = r ? `<section class="resum-dia">
    <div class="et">El resum del dia · ${esc(fmtDia(lotActiu))}</div>
    <h2>${esc(r.titular)}</h2>
    <ul>${r.punts.map(liEtiqueta).join('')}</ul>
    ${VEU_OK ? `<div class="accions">
      <button class="escolta" data-audio="dia">🔊 Escolta el resum del dia</button>
      <button class="escolta principal" data-audio="tot">▶ Escolta-ho tot</button>
    </div>` : ''}
  </section>` : '';
}

function pintaResumSetmana() {
  const r = SETMANES[lotActiu.slice(2)];
  const bloc = (titol, llista) => llista?.length ? `<h3 class="subt">${titol}</h3><ul>${llista.map(liEtiqueta).join('')}</ul>` : '';
  document.getElementById('resumDia').innerHTML = `<section class="resum-dia setmanal">
    <div class="et">El resum de la setmana · del ${esc(fmtCurt(r.des_de))} al ${esc(fmtCurt(lotActiu.slice(2)))}</div>
    <h2>${esc(r.titular)}</h2>
    <ul>${r.punts.map(liEtiqueta).join('')}</ul>
    ${bloc('🤝 On coincideixen', r.coincideixen)}
    ${bloc('⚔️ On discrepen', r.discrepen)}
    ${bloc('👀 A vigilar la setmana vinent', r.a_vigilar)}
    ${VEU_OK ? `<div class="accions">
      <button class="escolta" data-audio="setmana">🔊 Escolta el resum de la setmana</button>
    </div>` : ''}
  </section>`;
}

function videosVisibles() {
  const q = cerca.toLowerCase();
  return D.videos.filter(v => esDelLot(v) && filtre.has(v.canal) &&
    (!q || [v.titol, v.resum, ...(v.punts || []).map(txt), ...(v.temes || [])].join(' ').toLowerCase().includes(q)));
}

function pintaXips() {
  const delLot = D.videos.filter(esDelLot);
  document.getElementById('xips').innerHTML = CANALS.map(c =>
    `<button class="xip" style="--c:${c.color}" data-c="${c.id}" aria-pressed="${filtre.has(c.id)}"><i></i>${esc(c.nom)} <b>${delLot.filter(v => v.canal === c.id).length}</b></button>`).join('') +
    `<input type="search" id="cerca" placeholder="Cerca (bitcoin, BCE, IA…)" value="${esc(cerca)}">`;
  document.querySelectorAll('.xip').forEach(b => b.onclick = () => {
    filtre.has(b.dataset.c) ? filtre.delete(b.dataset.c) : filtre.add(b.dataset.c);
    if (!filtre.size) CANALS.forEach(c => filtre.add(c.id));
    pinta();
  });
  const inp = document.getElementById('cerca');
  inp.oninput = () => { cerca = inp.value; pintaLlista(); };
}

function pintaLlista() {
  const vs = videosVisibles();
  document.getElementById('llista').innerHTML = vs.length ? vs.map(v => {
    const c = canal[v.canal] || { nom: v.canal, color: '#888' };
    const url = 'https://www.youtube.com/watch?v=' + encodeURIComponent(v.id);
    return `<article class="video" id="v-${esc(v.id)}" style="--c:${c.color}">
      <div class="cap">
        <a class="miniatura" href="${url}" target="_blank" rel="noopener"><img loading="lazy" alt="" src="https://i.ytimg.com/vi/${encodeURIComponent(v.id)}/mqdefault.jpg"><span>${fmtDurada(v.durada || 0)}</span></a>
        <div>
          <div class="meta"><span class="canal">${esc(c.nom)}</span><span>${esc(fmtHora(v.data))}</span>${VEU_OK ? `<button class="escolta" data-audio="${esc(v.id)}" title="Escolta el resum">🔊 Escolta</button>` : ''}</div>
          <h3><a href="${url}" target="_blank" rel="noopener">${esc(v.titol)}</a></h3>
          <p class="resum">${esc(v.resum)}</p>
        </div>
      </div>
      <details>
        <summary>Punts clau i conclusió</summary>
        <div class="cos">
          <ul>${(v.punts || []).map(p => `<li>${esc(txt(p))}${Number.isFinite(p?.t) ? ` <a class="minut" href="${url}&t=${Math.floor(p.t)}s" target="_blank" rel="noopener" title="Obre el vídeo en aquest moment">▶ ${mmss(Math.floor(p.t))}</a>` : ''}</li>`).join('')}</ul>
          ${v.dades?.length ? `<h4>Xifres</h4><ul>${v.dades.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
          ${v.conclusio ? `<div class="conclusio"><strong>Què me n'emporto:</strong> ${esc(v.conclusio)}</div>` : ''}
          <div class="temes">${(v.temes || []).map(t => `<button class="tema" data-t="${esc(t)}">#${esc(t)}</button>`).join('')}</div>
        </div>
      </details>
    </article>`;
  }).join('') : `<p class="buit">${D.videos.length ? 'Cap vídeo amb aquest filtre.' : 'Encara no hi ha resums.'}</p>`;
  document.querySelectorAll('.tema').forEach(b => b.onclick = () => {
    cerca = b.dataset.t; lotActiu = '*'; pinta();
  });
}

function pinta() { pintaDies(); pintaResumDia(); pintaXips(); pintaLlista(); marcaSonant(); }

/* ── Àudio (veu del navegador, Web Speech API) ─────────────────────────────── */
// Cua de "pistes" (resum del dia o un vídeo); cada pista es parteix en frases
// perquè Chrome talla les locucions llargues.
const synth = window.speechSynthesis;
const A = { cua: [], pista: -1, frases: [], frase: 0, pausat: false, vel: Number(llegeix('tv-vel')) || 1, veu: null };
document.getElementById('rpVel').value = String(A.vel);

function triaVeu() {
  const veus = synth.getVoices();
  const puntua = v => (v.lang.toLowerCase().startsWith('ca') ? 100 : v.lang.toLowerCase().startsWith('es-es') ? 10 : v.lang.toLowerCase().startsWith('es') ? 5 : 0)
    + (/natural|online|google/i.test(v.name) ? 2 : 0);
  A.veu = veus.slice().sort((a, b) => puntua(b) - puntua(a))[0] || null;
}
if (VEU_OK) { triaVeu(); synth.onvoiceschanged = triaVeu; }

// Adapta símbols i xifres perquè la veu els llegeixi bé.
const perLlegir = t => String(t)
  .replace(/(\d)\.(\d{3})/g, '$1$2').replace(/(\d)\.(\d{3})/g, '$1$2')
  .replace(/M\$/g, ' milions de dòlars').replace(/M€/g, ' milions d\'euros')
  .replace(/\s?\$/g, ' dòlars').replace(/\s?€/g, ' euros')
  .replace(/×\s?(\d)/g, 'per $1').replace(/(\d)\s?–\s?(\d)/g, '$1 a $2').replace(/(\d)-(\d)/g, '$1 a $2')
  .replace(/\bEUA\b/g, 'Estats Units').replace(/\bUE\b/g, 'Unió Europea').replace(/\bIA\b/g, 'intel·ligència artificial')
  .replace(/[«»"]/g, '');

const frases = t => perLlegir(t).match(/[^.!?;]+[.!?;]*\s*/g)?.map(s => s.trim()).filter(Boolean) || [];

function pistaDia(lot) {
  const r = D.dies[lot];
  return { id: 'dia', nom: 'El resum del dia', frases: [`Resum del ${fmtDia(lot)}.`, ...frases(r.titular), ...r.punts.flatMap(frases)] };
}
function pistaSetmana(data) {
  const r = SETMANES[data];
  const bloc = (t, l) => l?.length ? [t, ...l.flatMap(frases)] : [];
  const llarg = d => new Date(d + 'T12:00').toLocaleDateString('ca', { day: 'numeric', month: 'long' });
  return { id: 'setmana', nom: 'El resum de la setmana', frases: [`Resum de la setmana del ${llarg(r.des_de)} al ${llarg(data)}.`,
    ...frases(r.titular), ...r.punts.flatMap(frases), ...bloc('On coincideixen.', r.coincideixen),
    ...bloc('On discrepen.', r.discrepen), ...bloc('A vigilar la setmana vinent.', r.a_vigilar)] };
}
function pistaVideo(v) {
  const c = canal[v.canal]?.nom || '';
  return { id: v.id, nom: `${c}: ${v.titol}`, frases: [
    `${c}.`, ...frases(v.titol), ...frases(v.resum),
    ...(v.punts?.length ? ['Punts clau.', ...v.punts.map(txt).flatMap(frases)] : []),
    ...(v.conclusio ? ['Què me n\'emporto.', ...frases(v.conclusio)] : []),
  ] };
}

function comenca(cua) {
  synth.cancel();
  Object.assign(A, { cua, pista: 0, frase: 0, pausat: false });
  document.body.classList.add('amb-reproductor');
  document.getElementById('reproductor').classList.add('actiu');
  parla();
}

function parla() {
  const p = A.cua[A.pista];
  if (!p) return atura();
  if (A.frase >= p.frases.length) { A.pista++; A.frase = 0; return parla(); }
  const u = new SpeechSynthesisUtterance(p.frases[A.frase]);
  if (A.veu) { u.voice = A.veu; u.lang = A.veu.lang; } else u.lang = 'ca-ES';
  u.rate = A.vel;
  const pista = A.pista;
  u.onend = () => { if (A.pista === pista && !A.pausat) { A.frase++; parla(); } };
  u.onerror = e => { if (e.error !== 'interrupted' && e.error !== 'canceled') { A.frase++; parla(); } };
  synth.speak(u);
  actualitzaReproductor();
}

function atura() {
  synth.cancel();
  Object.assign(A, { cua: [], pista: -1, pausat: false });
  document.body.classList.remove('amb-reproductor');
  document.getElementById('reproductor').classList.remove('actiu');
  marcaSonant();
}

function actualitzaReproductor() {
  const p = A.cua[A.pista];
  document.getElementById('rpQue').textContent = (A.pausat ? '⏸ ' : '🔊 ') + p.nom;
  document.getElementById('rpPas').textContent = `${A.pista + 1} de ${A.cua.length}` +
    (A.veu && !A.veu.lang.toLowerCase().startsWith('ca') ? ` · sense veu catalana al dispositiu, es fa servir: ${A.veu.name}` : '');
  document.getElementById('rpPausa').textContent = A.pausat ? '▶' : '⏸';
  marcaSonant();
}

function marcaSonant() {
  const id = A.cua[A.pista]?.id;
  document.querySelectorAll('.video').forEach(el => el.classList.toggle('sona', el.id === 'v-' + id));
  document.querySelectorAll('[data-audio]').forEach(b => b.classList.toggle('sona', !!id && b.dataset.audio === id));
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-audio]');
  if (!b) return;
  const quin = b.dataset.audio;
  if (A.cua[A.pista]?.id === quin && A.cua.length === 1) return atura(); // tornar a clicar = aturar
  if (quin === 'dia') comenca([pistaDia(lotActiu)]);
  else if (quin === 'setmana') comenca([pistaSetmana(lotActiu.slice(2))]);
  else if (quin === 'tot') comenca([...(D.dies[lotActiu] ? [pistaDia(lotActiu)] : []), ...videosVisibles().map(pistaVideo)]);
  else comenca([pistaVideo(D.videos.find(v => v.id === quin))]);
});
document.getElementById('rpAtura').onclick = atura;
document.getElementById('rpSeg').onclick = () => { synth.cancel(); A.pausat = false; A.pista++; A.frase = 0; parla(); };
document.getElementById('rpPausa').onclick = () => {
  // Es reprèn des de l'inici de la frase: pause()/resume() no és fiable amb totes les veus.
  A.pausat = !A.pausat;
  if (A.pausat) synth.cancel(); else parla();
  actualitzaReproductor();
};
document.getElementById('rpVel').onchange = e => {
  A.vel = Number(e.target.value); guarda('tv-vel', A.vel);
  if (A.cua.length && !A.pausat) { synth.cancel(); parla(); }
};
pinta();

// Instal·lable i funciona sense connexió (no a file://, on els service workers no van).
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
</script>
